<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0a151b"><title>演出の比較（確認用）</title><link rel="stylesheet" href="style.css?v=fx1"><link rel="stylesheet" href="portraits.css?v=fx1"><link rel="stylesheet" href="effects.css?v=fx1"><link rel="stylesheet" href="effects-preview.css?v=fx1"></head><body class="playing"><main id="app" class="fx-root" data-bg="dark"><div class="scenery fx-scenery"></div><div class="veil"></div><section id="game"><div id="portraits" class="portraits mode-game fx-portraits" aria-hidden="true"></div><div class="chapter"><span>EFFECT PREVIEW</span><span>確認用</span></div><div id="dialogue" role="status" aria-live="polite"><span id="speaker">確認用</span><span id="prose"></span><span class="next">確認用の文です</span></div></section><div class="fx-layer" aria-hidden="true"><div class="fx-vig"></div><div class="fx-grain"></div></div><p id="fxNotice" class="fx-notice" hidden>端末の設定により動く効果を省略しています（静的な効果のみ）</p><button id="fxOpen" class="fx-open" type="button" aria-controls="fxPanel" aria-expanded="false">設定を開く</button></main><aside id="fxPanel" class="fx-panel" hidden><div class="fx-panel-head"><h1>演出の比較</h1><button id="fxClose" type="button" aria-label="設定を閉じる">閉じる</button></div><div class="fx-group"><h2>強さ</h2><div class="fx-seg" id="fxLevels"><button type="button" data-level="none">効果なし</button><button type="button" data-level="weak">弱</button><button type="button" data-level="mid">中</button><button type="button" data-level="strong">強</button></div></div><div class="fx-group"><h2>背景</h2><div class="fx-seg" id="fxBg"><button type="button" data-bg="dark">暗い</button><button type="button" data-bg="light">明るい</button></div></div><div class="fx-group"><h2>効果の種類</h2><label class="fx-check"><input id="fxStatic" type="checkbox" checked> 周辺減光・ぼかし（静的）</label><label class="fx-check"><input id="fxGrain" type="checkbox" checked> 粒状ノイズ（動く）</label><p class="fx-note" id="fxReduceNote" hidden>端末の設定により動く効果を省略しています。粒状ノイズは使えません。</p></div><div class="fx-group"><h2>発火のタイミング</h2><div class="fx-seg" id="fxTiming"><button type="button" data-timing="now">再生直後</button><button type="button" data-timing="text">文字送り完了時</button></div></div><div class="fx-group fx-actions"><button id="fxPlay" type="button">再生</button><button id="fxStop" type="button">停止・効果解除</button></div><p class="fx-note">表示される文は確認用のサンプルで、本編の台詞ではありません。本編の進行・セーブには影響しません。</p><div class="fx-group"><h2>比較用URL</h2><input id="fxUrl" class="fx-url" type="text" readonly></div></aside><script src="portraits.js?v=fx1"></script><script src="effects.js?v=fx1"></script><script src="effects-preview.js?v=fx1"></script></body></html>
