<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#0a151b"><title>演出の比較（確認用）</title><link rel="stylesheet" href="style.css?v=fx-diag-2"><link rel="stylesheet" href="portraits.css?v=fx-diag-2"><link rel="stylesheet" href="effects.css?v=fx-diag-2" onerror="window.fxLoadError&&fxLoadError('effects.css')"><link rel="stylesheet" href="effects-preview.css?v=fx-diag-2" onerror="window.fxLoadError&&fxLoadError('effects-preview.css')"></head><body class="playing" data-html-version="fx-diag-2" data-expected-js="fx-diag-2"><main id="app" class="fx-root" data-bg="dark"><div class="scenery fx-scenery"></div><div class="veil"></div><section id="game"><div id="portraits" class="portraits mode-game fx-portraits" aria-hidden="true"></div><div class="chapter"><span>EFFECT PREVIEW</span><span>確認用</span></div><div id="dialogue" role="status" aria-live="polite"><span id="speaker">確認用</span><span id="prose"></span><span class="next">確認用の文です</span></div></section><div class="fx-layer" aria-hidden="true"><div class="fx-vig"></div><canvas class="fx-noise" data-kind="main"></canvas><canvas class="fx-noise fx-red" data-kind="red"></canvas><canvas class="fx-noise fx-cyan" data-kind="cyan"></canvas></div><p id="fxNotice" class="fx-notice" hidden>端末の設定により動く効果を省略しています（静的な効果のみ）</p></main>
<section id="fxDock" class="fx-dock fx-collapsed" aria-label="版と診断"><div class="fx-dock-row"><p id="fxBoot" class="fx-boot" role="status">演出JS未起動</p><p id="fxVer" class="fx-ver"></p></div><div class="fx-dock-row fx-dock-btns"><button id="fxOpen" type="button" aria-controls="fxPanel" aria-expanded="false">設定を開く</button><button id="dgSolid" type="button">単色テスト</button><button id="dgStill" type="button">静止ノイズ</button><button id="dgClear" type="button">停止・解除</button><button id="dgToggle" type="button" aria-expanded="false" aria-controls="dgStatus">診断詳細を開く</button></div><dl id="dgStatus" class="fx-status"><dt>状態</dt><dd>演出JSが起動すると表示されます</dd></dl></section>
<aside id="fxPanel" class="fx-panel" hidden><div class="fx-panel-head"><h1>演出の比較</h1><button id="fxClose" type="button" aria-label="設定を閉じる">閉じる</button></div><div class="fx-group fx-play"><p class="fx-state" id="fxState" role="status">状態：停止中</p><div class="fx-actions"><button id="fxPlay" type="button">再生</button><button id="fxLoop" type="button" aria-pressed="false">連続プレビュー</button><button id="fxPause" type="button" disabled>一時停止</button><button id="fxStill" type="button">静止ノイズを表示</button><button id="fxStop" type="button">停止・効果解除</button></div></div><div class="fx-group"><h2>強さ</h2><div class="fx-seg" id="fxLevels"><button type="button" data-level="none">効果なし</button><button type="button" data-level="weak">弱</button><button type="button" data-level="mid">中</button><button type="button" data-level="strong">強</button></div></div><div class="fx-group"><h2>ノイズの薄さ（ノイズ層だけ）</h2><div class="fx-seg" id="fxNop"><button type="button" data-nop="100">現在の弱と同じ</button><button type="button" data-nop="75">少し薄い</button><button type="button" data-nop="50">半分</button><button type="button" data-nop="25">かなり薄い</button></div></div><div class="fx-group"><h2>背景</h2><div class="fx-seg" id="fxBg"><button type="button" data-bg="dark">暗い</button><button type="button" data-bg="light">明るい</button></div></div><div class="fx-group"><h2>効果の種類</h2><label class="fx-check"><input id="fxStatic" type="checkbox" checked> 周辺減光・ぼかし（静的）</label><label class="fx-check"><input id="fxGrain" type="checkbox" checked> 粒状ノイズ（動く）</label><label class="fx-check"><input id="fxColor" type="checkbox"> 色ずれ（赤・シアン、ノイズ層のみ）</label><p class="fx-note" id="fxReduceNote" hidden>端末の設定により動く効果を省略しています。動く粒状ノイズは自動では出しません。</p></div><div class="fx-group"><h2>発火のタイミング</h2><div class="fx-seg" id="fxTiming"><button type="button" data-timing="now">再生直後</button><button type="button" data-timing="text">文字送り完了時</button></div></div><p class="fx-note">表示される文は確認用のサンプルで、本編の台詞ではありません。本編の進行・セーブには影響しません。</p><div class="fx-group"><h2>比較用URL</h2><input id="fxUrl" class="fx-url" type="text" readonly></div></aside>
<noscript><p class="fx-boot">この確認ページは JavaScript が必要です。</p></noscript>
<script>window.fxLoadError=function(name){var b=document.getElementById('fxBoot');if(b)b.textContent='読込エラー: '+name+'（演出JS未起動）';};</script>
<script src="portraits.js?v=fx-diag-2" onerror="fxLoadError('portraits.js')"></script><script src="effects.js?v=fx-diag-2" onerror="fxLoadError('effects.js')"></script><script src="effects-preview.js?v=fx-diag-2" onerror="fxLoadError('effects-preview.js')"></script></body></html>
